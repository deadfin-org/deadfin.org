name: pages

# A push to main, the daily schedule and a deadfin-release dispatch from the
# Deadfin release workflow publish the site. Other refs build and check only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [deadfin-release]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The newest Deadfin release and its bundled deadfin-web tag.
      - name: Stamp the release versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/stamp-versions.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check site files
        env:
          LEAK_PATTERN: ${{ secrets.LEAK_PATTERN }}
        run: scripts/check-site.sh _site

      # actions/configure-pages v6.0.0
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      # actions/upload-pages-artifact v5.0.0
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages v5.0.1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
